name: Feature request
description: Suggest an improvement or a new tool.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      description: Which tool is this about?
      options:
        - NameChanger
        - PreFixer
        - ClassSearcher
        - New tool
        - Other / general
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What are you trying to do, and what is in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you considered.
    validations:
      required: false
